<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Usuarios</h1>
    <a href="/formulario">Nuevo usuario</a>

    <table>
        <thead>
            <tr>
                <th>
                    Id
                </th>
                <th>
                    Nombre completo 
                </th>
                <th>
                    Email
                </th>
                <th>
                    Fecha de Creacion 
                </th>
            </tr>

        </thead>
        <tbody>
            {% for elemento in todos_los_usuarios %}
                <tr>
                    <td>{{ elemento.id }}</td>
                    <td>{{ elemento.nombre }} {{ elemento.apellido }}</td>
                    <td>{{ elemento.email }}</td>
                    <td>{{ elemento.created_at }}</td>
                </tr>
            {% endfor %}


        </tbody>
    </table>


</body>
</html>
